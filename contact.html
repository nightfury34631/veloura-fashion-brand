<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact — Veloura</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="site-header"></div>
    <main class="contact section">
      <div>
        <p class="eyebrow">Get in touch</p>
        <h1>Let’s talk.</h1>
        <p>
          Questions, thoughts or a note for our studio?<br />We would love to
          hear from you.
        </p>
        <p class="contact-details">
          hello@veloura.example<br />Dhaka, Bangladesh
        </p>
      </div>
      <form id="contact-form" class="contact-form">
        <label>Name<input name="name" required /></label
        ><label>Email<input name="email" type="email" required /></label
        ><label>Subject<input name="subject" required /></label
        ><label
          >Message<textarea name="message" required rows="5"></textarea></label
        ><button class="button dark">Send message →</button>
        <p class="form-message" id="contact-message"></p>
      </form>
    </main>
    <div id="site-footer"></div>
    <div id="site-ui"></div>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
